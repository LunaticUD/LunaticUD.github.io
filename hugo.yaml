baseURL: "https://lunaticud.github.io/"
title: 泊尘畔
theme: PaperMod
locale: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false
summaryLength: 70

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

permalinks:
  posts: /posts/:slug/

taxonomies:
  tag: tags
  category: categories

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: 泊尘畔
  description: "生信、折腾与记录 —— Loong 的个人笔记"
  keywords: [生信, 生物信息, Python, R, Neovim, Linux, 博客]
  author: Loong
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  TocOpen: false

  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true

  assets:
    favicon: /favicon.svg
    favicon16x16: /favicon.svg
    favicon32x32: /favicon.svg

  label:
    text: "泊尘畔"
    icon: /favicon.svg
    iconHeight: 35

  profileMode:
    enabled: false

  homeInfoParams:
    Title: "你好，我是 Loong 👋"
    Content: |
      写给做生物信息的人：Linux 服务器上踩过的坑、跑通的流程，以及教程里不会写的那部分。

      **刚进实验室，要把环境跑起来**

      - [Miniconda 装 Python 和 R，接入 VSCode-Jupyter](/posts/miniconda-python-r-vscode-jupyter/) —— 一套命令建好双语言环境
      - [Windows 下搭一套顺手的终端](/posts/powershell-setup/) —— PowerShell 提示符与常用配置

      **要查数据、跑分析**

      - [生信数据库及工具](/posts/bioinfo-databases-tools/) —— 8 个数据库 + 19 个在线工具速查
      - [Windows 下的软件编译与测序质控](/posts/windows-software-build-qc/) —— MSYS2 编译 + fastp 质控
      - [各文献参考格式](/posts/citation-formats/) —— GB/T 7714 九类文献著录格式

      **想把编辑器调成自己的**

      - [Neovim 配置系列](/posts/nvim-preparation-1/) —— 2022 年的记录，插件管理部分已过时
      
      **想随便看看**

      - [山林不向四季起誓，海洋不需对沙岸承诺](/posts/shanlin-bu-xiang-siji-qishi/) —— 一篇写自我的随笔
      - [一日即是落地，执念不必连续](/posts/lianxu/) —— 一篇写努力的随笔


  socialIcons:
    - name: github
      url: "https://github.com/LunaticUD"
    - name: rss
      url: "/index.xml"

  analytics:
    google:
      SiteVerificationTag: ""
    bing:
      SiteVerificationTag: ""

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: "https://github.com/LunaticUD/LunaticUD.github.io/tree/main/content"
    Text: "建议修改"
    appendFilePath: true

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: about
      name: 关于
      url: /about/
      weight: 15
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 30
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 40
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\\[', '\\]']]
          inline: [['$', '$'], ['\\(', '\\)']]
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 4
